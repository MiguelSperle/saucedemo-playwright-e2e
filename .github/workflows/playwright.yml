name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "*/35 * * * *"
  workflow_dispatch:

concurrency:
  group: playwright-tests-${{ github.event_name }}-${{ github.ref }}
  # Cancela execuções antigas do workflow para dar lugar à nova execução, apenas em pull requests
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 30

  # Verificação periódica para verificar se os fluxos mais críticos do site funcionam conforme o esperado.
  # Fizemos dessa forma, pois como não controlamos o deploy da aplicação que está sendo testada
  # não conseguimos receber os status do deploy.
  smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep @smoke --project=chromium
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7
