# ============================================================================
# COMO ESTE WORKFLOW É ATIVADO
#
# Este workflow NÃO detecta deploys por conta própria. Quem o ativa é o
# pipeline de deploy da aplicação, que, ao terminar o deploy com sucesso,
# envia uma requisição para a API do GitHub:
#
#   POST https://api.github.com/repos/<usuario>/<este-repo>/dispatches
#   body: {"event_type": "staging-deployed"}   ou  {"event_type": "production-deployed"}
#
# O que roda em cada caso:
#   staging-deployed     -> smoke + regressão completa
#   production-deployed  -> somente smoke
#
# Observações:
#   - O arquivo precisa estar na branch padrão (main) para o gatilho funcionar.
#   - A chamada exige um token com permissão de escrita neste repositório,
#     guardado como secret no pipeline de deploy.
# ============================================================================


# ============================================================================
# TOKEN DE ACESSO (necessário para o pipeline de deploy avisar este workflow)
#
# O QUE É
#   Uma "senha de acesso" que prova ao GitHub que quem chama a API tem
#   permissão de escrita neste repositório. Sem ela, a chamada de aviso
#   (POST .../dispatches) é recusada e este workflow não é ativado.
#
# COMO GERAR (Personal Access Token fine-grained)
#   1. GitHub > foto de perfil > Settings > Developer settings
#      > Personal access tokens > Fine-grained tokens > Generate new token
#   2. Defina um nome e uma data de expiração.
#   3. Repository access: "Only select repositories" e marque SOMENTE este
#      repositório (o de testes).
#   4. Repository permissions: "Contents" = Read and write.
#   5. Gere e copie o token na hora (o GitHub só o mostra uma vez).
#
# ============================================================================

name: Playwright Tests

on:
  repository_dispatch:
    types: [staging-deployed, production-deployed]

# Cancela execuções antigas do mesmo workflow/branch/evento quando uma nova começa
concurrency:
  group: ${{ github.workflow }}-${{ github.event.action }}
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-latest # máquina virtual Linux fornecida pelo GitHub
    outputs:
      environment: ${{ steps.env.outputs.environment }} # staging ou production
      run_regression: ${{ steps.env.outputs.run_regression }} # "true" ou "false"
    steps:
      - id: env # identificador do step, usado na linha acima
        env: # joga os valores do GitHub em variáveis de ambiente do shell
          ACTION: ${{ github.event.action }} # nome do aviso (staging-deployed or production-deployed)
        run: |
          if [ "$ACTION" = "staging-deployed" ]; then
            environment=staging
            run_regression=true
          elif [ "$ACTION" = "production-deployed" ]; then
            environment=production
            run_regression=false
          else
            echo "Aviso não suportado: $ACTION"
            exit 1
          fi

          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "run_regression=$run_regression" >> "$GITHUB_OUTPUT"