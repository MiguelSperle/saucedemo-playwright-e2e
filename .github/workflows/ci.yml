name: Sauce Demo Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Cancela execuções antigas do mesmo workflow/branch/evento quando uma nova começa
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  full:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6 
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: npm
    - run: npm ci
    - run: npx playwright install --with-deps
    - run: npx playwright test
    - uses: actions/upload-artifact@v6
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-full
        path: playwright-report/
        retention-days: 30
  
  # Verificação periódica de disponibilidade e dos fluxos críticos do site
  # fizemos dessa forma, pois como não controlamos o deploy da aplicação testada
  # não conseguimos receber um sinal de que o deploy finalizou
  smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: npm
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: npx playwright test --grep @smoke --project=chromium
    - uses: actions/upload-artifact@v6
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-smoke
        path: playwright-report/
        retention-days: 7